set -g mouse on                            # trackpad scrolling
set -sg escape-time 10                     # no lag on Esc (Claude uses Esc to interrupt)
set -g history-limit 50000
set -g default-terminal "screen-256color"
set -g status-left-length 40               # don't truncate session names
setw -g mode-keys vi
set -g default-command "${SHELL}"          # avoids repeated Lmod MODULEPATH messages
