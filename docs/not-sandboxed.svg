<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc">
  <title id="title">Plain claude, outside the sandbox</title>
  <desc id="desc">A terminal: the user runs plain claude in my-project, without tclaude. Under Claude's text box, an amber badge reads "NOT SANDBOXED", followed by "Claude can write anywhere you can".</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #d9e7ed; white-space: pre; }
    .dim { fill: #7f97a3; }
    .bold { font-weight: 700; }
  </style>

  <!-- window -->
  <rect width="1000" height="240" rx="10" fill="#101d25"/>
  <circle cx="20" cy="16" r="5" fill="#ffffff" fill-opacity="0.16"/>
  <circle cx="38" cy="16" r="5" fill="#ffffff" fill-opacity="0.16"/>
  <circle cx="56" cy="16" r="5" fill="#ffffff" fill-opacity="0.16"/>
  <line x1="0" y1="32.5" x2="1000" y2="32.5" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- shell -->
  <text x="20" y="60"><tspan class="dim">$</tspan> cd ~/my-project</text>
  <text x="20" y="82"><tspan class="dim">$</tspan> claude</text>
  <text x="20" y="126" class="dim">  … Claude Code starts, outside the sandbox …</text>

  <!-- Claude's text box -->
  <rect x="20.5" y="146.5" width="959" height="38" rx="6" fill="none" stroke="#7f97a3"/>
  <text x="36" y="171">&gt;</text>
  <rect x="54" y="157" width="9" height="18" fill="#d9e7ed"/>

  <!-- status line: tclaude-statusline -->
  <rect x="20" y="196" width="148" height="22" fill="#ffaf00"/>
  <text x="94" y="212" text-anchor="middle" class="bold" style="fill:#000000">NOT SANDBOXED</text>
  <text x="180" y="212">Claude can write anywhere you can</text>
</svg>
